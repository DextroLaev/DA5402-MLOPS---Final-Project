name: CI/CD Pipeline

# ── Triggers ──────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:          # allows manual trigger from GitHub UI

# ── Shared env ──
env:
  REGISTRY: docker.io
  API_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/face-recognition-api
  TRAINER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/face-recognition-trainer
  AIRFLOW_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/face-recognition-airflow

# Cancel in-progress runs on the same branch (avoid redundant builds)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 1 — Lint & Unit Tests
  # Runs on every push and every PR. Fast — no Docker, no GPU needed.
  # ────────────────────────────────────────────────────────────────────────────
  test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install test dependencies
        run: |
          pip install --upgrade pip
          pip install flake8 pytest pytest-cov
          # Install CPU-only torch for unit tests (no GPU needed)
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install mlflow==2.11.1 optuna pillow opencv-python-headless
          pip install mlflow==2.11.1 \
                numpy==1.26.4 \
                Pillow==10.2.0 \
                opencv-python-headless==4.9.0.80 \
                "flask>=3.0" \
                optuna==3.6.1 \
                mediapipe==0.10.21 \
                prometheus_client

      - name: Lint with flake8
        run: |
          # Fail on syntax errors and undefined names
          flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # Warn on style issues (don't fail the build)
          flake8 src/ --count --exit-zero --max-complexity=12 --max-line-length=120 --statistics

      - name: Run unit tests
        run: |
          pytest tests/ -v --tb=short --cov=src --cov-report=xml --cov-report=term-missing
        env:
          PYTHONPATH: ${{ github.workspace }}
          MLFLOW_TRACKING_URI: sqlite:///test_mlflow.db   # local SQLite for tests

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 2 — Build & Push Docker Images
  # Only runs on push to main or develop (not on PRs).
  # Builds all three images in parallel.
  # ────────────────────────────────────────────────────────────────────────────
  build:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: test                         # only build if tests pass
    if: github.event_name == 'push'     # skip on PRs

    strategy:
      matrix:
        include:
          - dockerfile: Dockerfile.api
            image_env: API_IMAGE
            context: .
            paths: '["Dockerfile.api", "flask_app/**", "src/**", "requirements.txt"]'
          - dockerfile: Dockerfile.train
            image_env: TRAINER_IMAGE
            context: .
            paths: '["Dockerfile.train", "src/**", "requirements.txt"]'
          - dockerfile: Dockerfile.airflow
            image_env: AIRFLOW_IMAGE
            context: .
            paths: '["Dockerfile.airflow","dags/**"]'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      
      - name: Check if rebuild needed
        id: changes
        run: |
          PATHS='${{ matrix.paths }}'
          CHANGED=false
          for pattern in $(echo $PATHS | tr -d '[]"' | tr ',' ' '); do
            if git diff --name-only HEAD~1 HEAD | grep -qE "$pattern"; then
              CHANGED=true
              break
            fi
          done
          echo "changed=$CHANGED" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env[matrix.image_env] }}
          tags: |
            # Always tag with the short git SHA so every build is traceable
            type=sha,prefix=,suffix=,format=short
            # Tag as 'latest' only on main branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            # Tag as 'dev' on develop branch
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/develop' }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache layers from the registry — speeds up subsequent builds significantly
          cache-from: type=registry,ref=${{ env[matrix.image_env] }}:buildcache
          cache-to: type=registry,ref=${{ env[matrix.image_env] }}:buildcache,mode=max

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 3 — Deploy to Production Server
  # SSH into your local machine and do a rolling update.
  # Only runs after a successful build on the main branch.
  # ────────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    # Require manual approval before deploying (optional — remove if unwanted)
    environment:
      name: production
      url: http://localhost:8080

    steps:
      - name: Checkout code (needed for docker-compose.yaml)
        uses: actions/checkout@v4

      - name: Set image tag from git SHA
        id: tag
        run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          # ── What runs on your machine ──────────────────────────────────────
          script: |
            set -euo pipefail
            cd ${{ secrets.DEPLOY_PROJECT_DIR }}

            echo "=== Pulling latest code ==="
            git pull origin main

            echo "=== Pulling new Docker images ==="
            docker pull ${{ env.API_IMAGE }}:${{ steps.tag.outputs.sha }}
            docker pull ${{ env.TRAINER_IMAGE }}:${{ steps.tag.outputs.sha }}
            docker pull ${{ env.AIRFLOW_IMAGE }}:${{ steps.tag.outputs.sha }}

            echo "=== Tagging as latest locally ==="
            docker tag ${{ env.API_IMAGE }}:${{ steps.tag.outputs.sha }} ${{ env.API_IMAGE }}:latest
            docker tag ${{ env.TRAINER_IMAGE }}:${{ steps.tag.outputs.sha }} trainer:latest
            docker tag ${{ env.AIRFLOW_IMAGE }}:${{ steps.tag.outputs.sha }} airflow-custom:latest

            echo "=== Starting all services ==="
            docker compose up -d

            echo "=== Waiting for Flask API to be healthy ==="
            for i in $(seq 1 20); do
              if curl -sf http://localhost:8080/health; then
                echo "Flask is healthy!"
                break
              fi
              echo "Attempt $i/20 — waiting 10s..."
              sleep 10
              if [ $i -eq 20 ]; then
                echo "Health check FAILED after 200s"
                docker compose ps
                docker compose logs flask-api --tail=50
                exit 1
              fi
            done

            docker compose ps

            echo "=== Deploy complete — SHA ${{ steps.tag.outputs.sha }} ==="