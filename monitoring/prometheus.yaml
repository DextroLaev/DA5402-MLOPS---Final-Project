global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "flask-api"
    static_configs:
      - targets: ["flask-api:2000"]
    metrics_path: /metrics

  - job_name: "node"
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: "dcgm"
    static_configs:
      - targets: ["dcgm-exporter:9400"]